<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Global latitude & longitude grid rings -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" />
  <ellipse cx="32" cy="32" rx="10" ry="20" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" />

  <!-- Dynamic Ascending Growth / Finance node structure forming stylized 'G' and upward arrow -->
  <path d="M 22 38 L 30 28 L 37 33 L 46 20" fill="none" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Arrow tip -->
  <path d="M 40 20 L 46 20 L 46 26" fill="none" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node points -->
  <circle cx="22" cy="38" r="2.5" fill="#38bdf8" />
  <circle cx="30" cy="28" r="2.5" fill="#38bdf8" />
  <circle cx="37" cy="33" r="2.5" fill="#818cf8" />
  <circle cx="46" cy="20" r="3" fill="#34d399" />
</svg>
