<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep space fintech gradient -->
    <radialGradient id="bgGrad512" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#161e31" />
      <stop offset="60%" stop-color="#0a0d17" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Electric glow gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Outer ring glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background for Gmail/Discord/Social profile -->
  <circle cx="256" cy="256" r="252" fill="url(#bgGrad512)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="6" />

  <!-- Background decorative concentric orbital rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Global Wireframe Sphere -->
  <g opacity="0.6">
    <!-- Outer Globe Rim -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="3" />
    <!-- Meridian Ellipses -->
    <ellipse cx="256" cy="256" rx="65" ry="130" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2.5" />
    <ellipse cx="256" cy="256" rx="20" ry="130" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />
    <!-- Latitude Lines -->
    <line x1="126" y1="256" x2="386" y2="256" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2.5" />
    <line x1="146" y1="195" x2="366" y2="195" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.8" />
    <line x1="146" y1="317" x2="366" y2="317" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.8" />
  </g>

  <!-- Glowing Ascending Growth & Financial Innovation Vector (Upward Curve & Arrow) -->
  <path d="M 175 320 L 225 260 L 285 295 L 360 175" fill="none" stroke="url(#neonGlow)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  
  <!-- Arrow Head -->
  <path d="M 315 175 L 360 175 L 360 220" fill="none" stroke="url(#neonGlow)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- High-Tech Data Nodes -->
  <circle cx="175" cy="320" r="14" fill="#0284c7" stroke="#fff" stroke-width="4" />
  <circle cx="225" cy="260" r="14" fill="#38bdf8" stroke="#fff" stroke-width="4" />
  <circle cx="285" cy="295" r="14" fill="#818cf8" stroke="#fff" stroke-width="4" />
  <circle cx="360" cy="175" r="16" fill="#34d399" stroke="#fff" stroke-width="5" filter="url(#softGlow)" />

  <!-- Monogram text GYFH at bottom -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="12" text-anchor="middle">
    GYFH
  </text>
  <text x="256" y="475" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#38bdf8" letter-spacing="4" text-anchor="middle">
    GLOBAL YOUTH FINANCE
  </text>
</svg>
